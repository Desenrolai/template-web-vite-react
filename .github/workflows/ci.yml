name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/desenrolai/${{ github.event.repository.name }}
  NODE_VERSION: '24'

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    # Runner parametrizado: sem a variável de repositório, cai no runner hospedado.
    # `fromJSON` porque um runner self-hosted é um *conjunto* de labels — uma string
    # com vírgula viraria um único label chamado "self-hosted,desenrolai".
    # Ver README, seção "Repo privado: o CI nasce morto sem estas variáveis".
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Em pull request a imagem é só construída: sem login no GHCR e sem
  # `packages: write`. Sem este job, um Dockerfile quebrado atravessa o PR
  # inteiro verde e só aparece depois do merge.
  docker-build:
    name: Docker Build (PR)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: ci
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (sem push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker:
    name: Docker Build & Push
    runs-on: ${{ fromJSON(vars.CI_RUNNER_DOCKER || '"ubuntu-latest"') }}
    needs: ci
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: read
      # Só o push da imagem precisa escrever no GHCR.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.repository.default_branch }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
